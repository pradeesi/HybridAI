[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai"
version = "0.1.0"
description = "Enterprise Telecom Customer Care Hybrid AI Platform and Secure FastMCP Server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Telecom HybridAI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "prometheus-client>=0.20.0",
    "faker>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
