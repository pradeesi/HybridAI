# Purpose: Kubernetes Deployment and Service manifests for Telecom FastMCP and CRM Console.
# Architecture/Context: Orchestrates scalable pods on Google Kubernetes Engine (GKE) or vanilla k8s.
# Dependencies/Side Effects: Ingests secrets from Secret/telecom-secrets and attaches ClusterIP services.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-mcp-server
  labels:
    app: telecom-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecom-mcp
  template:
    metadata:
      labels:
        app: telecom-mcp
    spec:
      containers:
      - name: mcp-server
        image: telecom-hybrid-ai:latest
        command: ["python3", "-m", "src.mcp.server"]
        ports:
        - containerPort: 8001
        env:
        - name: APP_ENV
          value: "production"
        - name: MCP_PORT
          value: "8001"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: telecom-secrets
              key: mcp-token
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: telecom-secrets
              key: database-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-mcp-service
spec:
  selector:
    app: telecom-mcp
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-crm-console
  labels:
    app: telecom-crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecom-crm
  template:
    metadata:
      labels:
        app: telecom-crm
    spec:
      containers:
      - name: crm-console
        image: telecom-hybrid-ai:latest
        command: ["python3", "-m", "src.crm.app"]
        ports:
        - containerPort: 8000
        env:
        - name: APP_ENV
          value: "production"
        - name: CRM_PORT
          value: "8000"
        - name: MCP_PORT
          value: "8001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: telecom-secrets
              key: database-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-crm-service
spec:
  type: LoadBalancer
  selector:
    app: telecom-crm
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
